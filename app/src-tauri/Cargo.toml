[package]
name = "app"
version = "0.1.0"
description = "Strays: animated pets for your unfinished projects"
authors = ["khubaibqaiser"]
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Debug-only test hooks (spec §14.3): allows the local fake GitHub server. Never on in release builds.
devtools = ["strays-core/devtools"]

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strays-core = { version = "0.1.0", path = "../core" }
notify = "8"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3"] }
tauri-plugin-global-shortcut = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSEvent", "NSWindow", "NSResponder", "NSView", "NSScreen", "NSWorkspace", "NSRunningApplication", "NSGraphics", "NSApplication", "NSAccessibility", "NSAlert", "NSPanel", "NSWindow", "NSButton", "NSControl", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFBase", "CFArray", "CFDictionary", "CFString", "CFNumber"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGWindow", "CGDirectDisplay", "CGGeometry", "CGSession"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSArray", "NSGeometry", "NSNotification", "NSURL", "NSData", "NSError"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
security-framework = "3.7.0"

[dev-dependencies]
# tests run the sync loop against the local fake GitHub server, which only devtools builds may reach
strays-core = { path = "../core", features = ["devtools"] }
