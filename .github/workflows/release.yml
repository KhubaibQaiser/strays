# Release (spec §16): pushing a tag like v0.1.0 builds the Apple Silicon .dmg and attaches it to a draft
# GitHub release, which is published by hand. With the Apple secrets set, the app is signed with the
# Developer ID and notarised; without them it's ad-hoc signed and the release says it's a test build.
#
# Two jobs, so the signing secrets never share a machine with third-party code: `build` runs npm and
# cargo (every package's build scripts) with no secrets at all, and `sign` starts on a fresh runner
# with only Apple's tools, the built app, the entitlements and the audit script.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # later steps execute package code; keep the token out of .git/config
      - name: Tag matches the app version
        run: |
          v=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but tauri.conf.json says $v"; exit 1; }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: cargo test --locked
        working-directory: app/src-tauri
      # unsigned here; `sign` signs it
      - run: npx tauri build --bundles app --no-sign
        env:
          # baked in at compile time; without it the build simply can't send error reports. It's an
          # ingest-only key (anyone with the app has it), not a signing secret.
          STRAYS_POSTHOG_KEY: ${{ secrets.STRAYS_POSTHOG_KEY }}
          STRAYS_POSTHOG_HOST: ${{ vars.STRAYS_POSTHOG_HOST }}
      - run: lipo src-tauri/target/release/bundle/macos/Strays.app/Contents/MacOS/Strays -verify_arch arm64
      # ditto keeps the bundle's symlinks and attributes, which a plain upload would lose
      - run: ditto -c -k --keepParent src-tauri/target/release/bundle/macos/Strays.app "$RUNNER_TEMP/Strays.app.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-app
          path: ${{ runner.temp }}/Strays.app.zip
          retention-days: 1

  sign:
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write # the draft release
    steps:
      # only what signing needs: the entitlements, the audit script and the version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            app/src-tauri/Entitlements.plist
            app/src-tauri/tauri.conf.json
            tools/permissions-audit.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-app
          path: ${{ runner.temp }}
      - run: ditto -x -k "$RUNNER_TEMP/Strays.app.zip" "$RUNNER_TEMP/out"
      - name: Sign
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/out/Strays.app"
          if [ -z "$APPLE_CERTIFICATE" ]; then
            # test build: ad-hoc, still with the sandbox entitlements
            codesign --force --deep --sign - --entitlements app/src-tauri/Entitlements.plist "$app"
            exit 0
          fi
          kc="$RUNNER_TEMP/sign.keychain-db"; pass=$(uuidgen)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pass" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pass" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$pass" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          codesign --force --deep --options runtime --timestamp --keychain "$kc" --sign "$APPLE_SIGNING_IDENTITY" --entitlements app/src-tauri/Entitlements.plist "$app"
          codesign --verify --deep --strict "$app"
      - run: tools/permissions-audit.sh "$RUNNER_TEMP/out/Strays.app"
      - name: Disk image
        run: |
          v=$(plutil -extract version raw -o - app/src-tauri/tauri.conf.json 2>/dev/null || node -p 'require("./app/src-tauri/tauri.conf.json").version')
          mkdir -p "$RUNNER_TEMP/dmg" "$RUNNER_TEMP/image"
          # the app next to an Applications shortcut, so installing or updating is one drag
          ditto "$RUNNER_TEMP/out/Strays.app" "$RUNNER_TEMP/image/Strays.app"
          ln -s /Applications "$RUNNER_TEMP/image/Applications"
          hdiutil create -volname Strays -srcfolder "$RUNNER_TEMP/image" -ov -format UDZO "$RUNNER_TEMP/dmg/Strays_${v}_aarch64.dmg"
      - name: Notarise
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          [ -n "$P8" ] || { echo "no notarisation key: test build"; exit 0; }
          dmg=$(ls "$RUNNER_TEMP"/dmg/*.dmg)
          printf '%s\n' "$P8" > "$RUNNER_TEMP/notary.p8"
          codesign --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$dmg"
          xcrun notarytool submit "$dmg" --key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          rm "$RUNNER_TEMP/notary.p8"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature -v "$dmg"
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          if [ "$SIGNED" = "true" ]; then note="Signed and notarised. Apple Silicon, macOS 14 or later."
          else note="Test build: ad-hoc signed, not notarised, so macOS blocks it on first open. Apple Silicon, macOS 14 or later."; fi
          (cd "$RUNNER_TEMP/dmg" && shasum -a 256 *.dmg > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/dmg/*.dmg "$RUNNER_TEMP/dmg/SHA256SUMS" --repo "$GITHUB_REPOSITORY" \
            --draft --title "Strays $GITHUB_REF_NAME" --notes "$note See docs/user-guide.md."
