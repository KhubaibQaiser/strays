# Tests (spec §14.2, §15.3). Actions are pinned to commit SHAs (§9 hardening).
# The repo is private, where macOS runner minutes cost more, so the macOS job runs on main and on demand;
# pull requests get the Linux jobs (core logic and the window UI).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/core
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: npm audit --omit=dev --audit-level=high

  app:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: cargo test --locked
        working-directory: app/src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: app/src-tauri
      # CI=true skips the Finder AppleScript that lays out the .dmg window (it times out without a GUI session)
      # Apple Silicon only (docs/gate-4.md says why); the runner is arm64, so this builds arm64
      - run: npx tauri build --bundles app,dmg
        env:
          CI: true
      - run: ../tools/permissions-audit.sh src-tauri/target/release/bundle/macos/Strays.app
      - run: lipo src-tauri/target/release/bundle/macos/Strays.app/Contents/MacOS/Strays -verify_arch arm64
